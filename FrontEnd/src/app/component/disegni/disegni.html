<div class="disegno-grid">
  <div class="add-card" (click)="openDialog()">
    <div class="add-svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.0.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M336 112C336 103.2 328.8 96 320 96C311.2 96 304 103.2 304 112L304 304L112 304C103.2 304 96 311.2 96 320C96 328.8 103.2 336 112 336L304 336L304 528C304 536.8 311.2 544 320 544C328.8 544 336 536.8 336 528L336 336L528 336C536.8 336 544 328.8 544 320C544 311.2 536.8 304 528 304L336 304L336 112z"/></svg>
    </div>
  </div>
  <mat-card class="example-card" appearance="outlined" *ngFor="let disegno of disegni">
    <mat-card-header>
      <div mat-card-avatar class="example-header-image"></div>
      <div class="card-info">
        <mat-card-title>{{disegno.oggetto.titolo}}</mat-card-title>
        <mat-card-subtitle>{{disegno.oggetto.autore}}</mat-card-subtitle>
      </div>
      <div class="modify-image-container" (click)="openModifyDialog(disegno?.id)">
        <i class="fa-solid fa-pen"></i>
      </div>
    </mat-card-header>
    <img mat-card-image src="http://localhost:8080/images/{{disegno.oggetto.immagine}}" alt="Photo of a Shiba Inu">
    <mat-card-content>
      <p>
        {{disegno.oggetto.descrizione}}
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button matButton>LIKE</button>
      <button matButton>SHARE</button>
    </mat-card-actions>
  </mat-card>
</div>
