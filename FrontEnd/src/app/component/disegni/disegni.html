<div class="search-container">
  <div class="search-field">
    <input matInput placeholder="Search" #text>
    <i class="fa-solid fa-magnifying-glass"></i>
  </div>
</div>
@if (isAdmin) {
    <div class="add-card" (click)="openDialog()">
      <div class="add-svg-container">
          <span class="c-mobile__button__plus fa fa-plus"></span>
      </div>
    </div>
  }
<div class="disegno-grid">
  @for (disegno of disegni; track disegno.id) {
    @if((text.value == "" || (disegno.oggetto.titolo | lowercase).includes(text.value |lowercase))){
      <mat-card class="example-card" (click)="openInfoDialog(disegno)">
        <mat-card-header>
          <div class="card-info">
            <mat-card-title>{{disegno.oggetto.titolo}}</mat-card-title>
            <mat-card-subtitle> di {{disegno.oggetto.autore}}</mat-card-subtitle>
          </div>
          @if (isAdmin){
            <div class="modify-image-container" (click)="openModifyDialog(disegno?.id); $event.stopPropagation()">
              <i class="fa-solid fa-pen"></i>
            </div>
          }
        </mat-card-header>
        <mat-card-content>
          <div class="image-container">
            <img mat-card-image src="http://localhost:8080/images/{{disegno.oggetto.immagine}}" [alt]="disegno.oggetto.titolo">
          </div>
        </mat-card-content>
        <mat-card-actions>
          <button class="add-to-cart-btn" (click)="addToCart(disegno.id); $event.stopPropagation()" 
          matTooltip="Aggiungi al carrello" 
          aria-label="Button that displays a tooltip when focused or hovered over">
            <span class="material-symbols-outlined">
              add_shopping_cart
            </span>
          </button>
          <div class="price-section">
            <span class="price">{{disegno.oggetto.prezzo | currency:'EUR' }}</span>
          </div>
        </mat-card-actions>
      </mat-card>
    }
  }
</div>
