<div class="add-card" (click)="openInsertDialog()">
    <div class="add-svg-container">
        <span class="c-mobile__button__plus fa fa-plus"></span>
    </div>
</div>
<div class="foto-grid">
    @for (illustrazione of illustrazioni; track illustrazione.id){
        <mat-card class="example-card" (click)="openInfoDialog(illustrazione)">
            <mat-card-header>
                <div class="card-info">
                    <mat-card-title>{{illustrazione.oggetto.titolo}}</mat-card-title>
                    <mat-card-subtitle> di {{illustrazione.oggetto.autore}}</mat-card-subtitle>
                </div>
                <div class="modify-image-container" (click)="openModifyDialog(illustrazione?.id); $event.stopPropagation()">
                    <i class="fa-solid fa-pen"></i>
                </div>
            </mat-card-header>
            <mat-card-content>
                <div class="image-container">
                    <img mat-card-image src="http://localhost:8080/images/{{illustrazione.oggetto.immagine}}" alt="Photo of a Shiba Inu">
                </div>
                <div class="price-section">
                    <span class="price">{{illustrazione.oggetto.prezzo | currency:'EUR' }}</span>
                </div>
            </mat-card-content>
            <mat-card-actions>
                <button class="add-to-cart-btn" (click)="addToCart(illustrazione.id); $event.stopPropagation()">Aggiungi al <i class="fas fa-shopping-cart"></i></button>
            </mat-card-actions>
        </mat-card>
    }
</div>
